<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICO · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2272b8">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="catalog">

<!-- ═══ CATALOG ═══ -->
<div class="page active" id="page-catalog">
  <div class="catalog-wrap">
    <div class="cat-toolbar">
      <span class="cat-title">Catálogo de Componentes</span>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button id="sucursalBadge" onclick="reopenSucursalGate()" title="Cambiar sucursal"
          style="display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;border:none;background:var(--white);color:var(--b600);font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;box-shadow:var(--sh1);transition:all .16s;white-space:nowrap"></button>
        <div class="search-wrap">
          <span style="color:var(--g300)">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar producto..." oninput="filterProducts()">
        </div>
      </div>
    </div>
    <div class="filter-bar">
      <div class="filter-dd" id="filterDropdown">
        <button class="filter-btn" id="filterBtn" type="button" onclick="toggleFilterMenu(event)" aria-haspopup="true" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
          <span id="filterBtnLabel">Filtrar por</span>
          <svg class="filter-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="filter-menu" id="filterMenu" role="menu">
          <button class="filter-item active" type="button" role="menuitemradio" onclick="filterCat('Todos',this)">Todos<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Resistencias',this)">Resistencias<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Capacitores',this)">Capacitores<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Transistores',this)">Transistores<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Sensores',this)">Sensores<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Microcontroladores',this)">Microcontroladores<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('LEDs',this)">LEDs<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Conectores',this)">Conectores<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="filter-item" type="button" role="menuitemradio" onclick="filterCat('Módulos',this)">Módulos<svg class="filter-check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        </div>
      </div>
    </div>
    <div id="loadingProducts" class="nores">
      <div class="ni">⚡</div>
      <p>Cargando productos...</p>
    </div>
    <div id="paginationControlsTop" class="pager pager-top hidden">
      <button id="prevPageBtnTop" class="page-arrow" onclick="goToPage(currentPage - 1)" aria-label="Página anterior">‹</button>
      <span class="page-info-text">Página
        <input id="pageInputTop" type="number" min="1" class="page-input" inputmode="numeric"
          onchange="goToPageFromInput(this)"
          onkeydown="if(event.key==='Enter'){goToPageFromInput(this);this.blur();}"
          onfocus="this.select()" aria-label="Número de página">
        de <span id="pageTotalTop">1</span>
      </span>
      <button id="nextPageBtnTop" class="page-arrow" onclick="goToPage(currentPage + 1)" aria-label="Página siguiente">›</button>
    </div>
    <div class="pgrid" id="productsGrid" style="display:none"></div>
    <div id="paginationControls" class="pager pager-bottom hidden">
      <button id="prevPageBtn" class="page-arrow" onclick="goToPage(currentPage - 1)" aria-label="Página anterior">‹</button>
      <span class="page-info-text">Página
        <input id="pageInput" type="number" min="1" class="page-input" inputmode="numeric"
          onchange="goToPageFromInput(this)"
          onkeydown="if(event.key==='Enter'){goToPageFromInput(this);this.blur();}"
          onfocus="this.select()" aria-label="Número de página">
        de <span id="pageTotal">1</span>
      </span>
      <button id="nextPageBtn" class="page-arrow" onclick="goToPage(currentPage + 1)" aria-label="Página siguiente">›</button>
    </div>
    <div id="noResults" class="nores hidden">
      <div class="ni">🔎</div>
      <p>Sin resultados para tu búsqueda</p>
    </div>
  </div>
</div>

<!-- ═══ SCRIPTS (orden importante: config y components primero, init al final) ═══ -->
<script src="/js/config.js"></script>
<script src="/js/components.js"></script>
<script src="/js/products.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/discounts.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/orders.js"></script>
<script src="/js/catalog.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/init.js"></script>
</body>
</html>
