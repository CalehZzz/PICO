<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICO · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2272b8">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="catalog">

<!-- ═══ CATALOG ═══ -->
<div class="page active" id="page-catalog">
  <div class="catalog-wrap">
    <div class="cat-toolbar">
      <span class="cat-title">Catálogo de Componentes</span>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <button id="sucursalBadge" onclick="reopenSucursalGate()" title="Cambiar sucursal"
          style="display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1.5px solid var(--b200);background:var(--b50);color:var(--b600);font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .16s;white-space:nowrap"></button>
        <div class="search-wrap">
          <span style="color:var(--g300)">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar producto..." oninput="filterProducts()">
        </div>
      </div>
    </div>
    <div class="filters">
      <button class="fbtn active" onclick="filterCat('Todos',this)">Todos</button>
      <button class="fbtn" onclick="filterCat('Resistencias',this)">Resistencias</button>
      <button class="fbtn" onclick="filterCat('Capacitores',this)">Capacitores</button>
      <button class="fbtn" onclick="filterCat('Transistores',this)">Transistores</button>
      <button class="fbtn" onclick="filterCat('Sensores',this)">Sensores</button>
      <button class="fbtn" onclick="filterCat('Microcontroladores',this)">Microcontroladores</button>
      <button class="fbtn" onclick="filterCat('LEDs',this)">LEDs</button>
      <button class="fbtn" onclick="filterCat('Conectores',this)">Conectores</button>
      <button class="fbtn" onclick="filterCat('Módulos',this)">Módulos</button>
    </div>
    <div id="loadingProducts" class="nores">
      <div class="ni">⚡</div>
      <p>Cargando productos...</p>
    </div>
    <div class="pgrid" id="productsGrid" style="display:none"></div>
    <div id="paginationControls" class="hidden" style="display:flex;align-items:center;justify-content:center;gap:14px;padding:26px 0 4px;flex-wrap:wrap">
      <button id="prevPageBtn" class="page-arrow" onclick="goToPage(currentPage - 1)" aria-label="Página anterior">‹</button>
      <span id="pageInfo" style="font-size:.88rem;font-weight:700;color:var(--g700);min-width:90px;text-align:center"></span>
      <button id="nextPageBtn" class="page-arrow" onclick="goToPage(currentPage + 1)" aria-label="Página siguiente">›</button>
    </div>
    <div id="noResults" class="nores hidden">
      <div class="ni">🔎</div>
      <p>Sin resultados para tu búsqueda</p>
    </div>
  </div>
</div>

<!-- ═══ SCRIPTS (orden importante: config y components primero, init al final) ═══ -->
<script src="/js/config.js"></script>
<script src="/js/components.js"></script>
<script src="/js/products.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/discounts.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/orders.js"></script>
<script src="/js/catalog.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/init.js"></script>
</body>
</html>
